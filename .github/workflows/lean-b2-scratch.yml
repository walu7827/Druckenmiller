name: Lean B2 Scratch

on:
  push:
    branches:
      - scratch/lean-b2-kernel-20260829
    paths:
      - "scratch-lean/**"
      - ".github/workflows/lean-b2-scratch.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: scratch-lean
          build: true
      - name: Re-elaborate scratch
        working-directory: scratch-lean
        run: lake env lean -DwarningAsError=true Scratch.lean
