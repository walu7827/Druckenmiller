name: Lean B2 Scratch

on:
  push:
    branches:
      - scratch/lean-b2-kernel-20260829
    paths:
      - "scratch-lean/**"
      - ".github/workflows/lean-b2-scratch.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: scratch-lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Generate manifest and build
        working-directory: scratch-lean
        run: |
          lake update
          lake build Scratch
          lake env lean -DwarningAsError=true Scratch.lean
