name: Lean B2 Scratch

on:
  push:
    branches:
      - scratch/lean-b2-kernel-20260829
    paths:
      - "scratch-lean/**"
      - ".github/workflows/lean-b2-scratch.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan and pinned Lean
        shell: bash
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.29.0-rc3
      - name: Generate manifest and build
        working-directory: scratch-lean
        shell: bash
        run: |
          lake update
          lake build Scratch
          lake env lean -DwarningAsError=true Scratch.lean
      - name: Upload scratch output
        uses: actions/upload-artifact@v4
        with:
          name: lean-b2-scratch-output
          path: |
            scratch-lean/Scratch.lean
            scratch-lean/lake-manifest.json
            scratch-lean/.lake/build/lib/lean/Scratch.olean
          if-no-files-found: error
          retention-days: 1
