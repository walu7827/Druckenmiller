name: Lean B2 carrier scratch

on:
  push:
    branches:
      - scratch/lean-b2-kernel-20260829
    paths:
      - scratch-lean/**
      - .github/workflows/lean-b2-carrier.yml
  pull_request:
    paths:
      - scratch-lean/**
      - .github/workflows/lean-b2-carrier.yml
  workflow_dispatch:

jobs:
  carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Bootstrap Lake manifest
        working-directory: scratch-lean
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Elaborate B2 kernel probes
        working-directory: scratch-lean
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          for source in ScratchCarrier.lean ScratchTwoTerm.lean ScratchFirstExit.lean ScratchBall.lean ScratchBallFiber.lean ScratchCoareaAPI.lean; do
            lake env lean -DwarningAsError=true "$source"
          done
